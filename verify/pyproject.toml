[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recompute-kit-verify"
version = "0.1.0"
description = "Recompute a recompute-kit receipt on your own machine — trust no one. Stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vértice Criativo" }]
keywords = ["recompute", "verifiable", "mcp", "conformance", "receipt", "trustless"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://ai.verticecriativo.pt/kit"
Source = "https://github.com/trustless-ai/recompute-kit"

[project.scripts]
recompute-verify = "recompute_kit_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
